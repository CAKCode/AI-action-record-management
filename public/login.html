<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Task Sessions - 登录</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-overlay">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">C</div>
        <div class="auth-title">Codex Task Sessions</div>
      </div>
      <form id="loginForm" class="auth-form">
        <label class="auth-field">
          <span>用户名</span>
          <input id="loginUser" type="text" autocomplete="username" required>
        </label>
        <label class="auth-field">
          <span>密码</span>
          <input id="loginPass" type="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="auth-error" role="alert"></p>
        <button type="submit" class="button primary auth-submit">登录</button>
      </form>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
