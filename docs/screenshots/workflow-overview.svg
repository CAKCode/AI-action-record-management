<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Codex Task Sessions workflow overview</title>
  <desc id="desc">Redacted workflow diagram from request to task, worker, report, artifact and audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0e1718"/><stop offset="1" stop-color="#101f20"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#68d7bb"/></marker>
  </defs>
  <rect width="1440" height="720" rx="26" fill="url(#bg)"/>
  <text x="72" y="84" fill="#8debd1" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">CODEX TASK SESSIONS · REDACTED WORKFLOW</text>
  <text x="72" y="142" fill="#f1f7f5" font-family="Arial, sans-serif" font-size="42" font-weight="700">从请求到可审计结果</text>
  <text x="72" y="184" fill="#a9bbb7" font-family="Arial, sans-serif" font-size="20">持久 Task、后台执行、结构化报告和 Artifact 归档组成一条可恢复的工作流。</text>
  <g filter="url(#shadow)">
    <rect x="72" y="272" width="190" height="174" rx="18" fill="#172627" stroke="#315c54"/>
    <rect x="302" y="272" width="190" height="174" rx="18" fill="#172627" stroke="#315c54"/>
    <rect x="532" y="272" width="190" height="174" rx="18" fill="#172627" stroke="#315c54"/>
    <rect x="762" y="272" width="190" height="174" rx="18" fill="#172627" stroke="#315c54"/>
    <rect x="992" y="272" width="190" height="174" rx="18" fill="#172627" stroke="#315c54"/>
    <rect x="1222" y="272" width="146" height="174" rx="18" fill="#172627" stroke="#315c54"/>
  </g>
  <g fill="none" stroke="#68d7bb" stroke-width="4" marker-end="url(#arrow)">
    <path d="M262 359h34"/><path d="M492 359h34"/><path d="M722 359h34"/><path d="M952 359h34"/><path d="M1182 359h28"/>
  </g>
  <g font-family="Arial, sans-serif">
    <g fill="#8debd1" font-size="16" font-weight="700"><text x="96" y="315">01 · REQUEST</text><text x="326" y="315">02 · TASK</text><text x="556" y="315">03 · WORKER</text><text x="786" y="315">04 · REPORT</text><text x="1016" y="315">05 · ARTIFACT</text><text x="1246" y="315">06 · AUDIT</text></g>
    <g fill="#f1f7f5" font-size="25" font-weight="700"><text x="96" y="364">自然语言</text><text x="326" y="364">Session</text><text x="556" y="364">后台执行</text><text x="786" y="364">结构化</text><text x="1016" y="364">HTML / 媒体</text><text x="1246" y="364">审计</text></g>
    <g fill="#a9bbb7" font-size="16"><text x="96" y="402">目标与约束</text><text x="326" y="402">Turn / Attempt</text><text x="556" y="402">PID / STATE</text><text x="786" y="402">结果 / 重跑</text><text x="1016" y="402">登记 / 归档</text><text x="1246" y="402">恢复</text></g>
  </g>
  <rect x="72" y="548" width="1296" height="80" rx="16" fill="#152323" stroke="#294b45"/>
  <text x="104" y="598" fill="#c8dbd6" font-family="Arial, sans-serif" font-size="20">安全边界：幂等操作 · 进程身份 · 路径校验 · SHA-256 · Viewed 状态 · 可恢复续跑</text>
</svg>
