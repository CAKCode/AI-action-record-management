<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Redacted report and artifact lifecycle</title>
  <desc id="desc">Generic task report card showing registered HTML, archived artifact and Viewed state without business data.</desc>
  <rect width="1440" height="820" rx="24" fill="#0d1213"/>
  <rect x="44" y="38" width="1352" height="744" rx="18" fill="#151c1d" stroke="#2b4643"/>
  <text x="82" y="94" fill="#8debd1" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">TASK REPORT · REDACTED EXAMPLE</text>
  <text x="82" y="144" fill="#f1f7f5" font-family="Arial, sans-serif" font-size="34" font-weight="700">通用回归任务</text>
  <rect x="1184" y="104" width="148" height="38" rx="19" fill="#16382f" stroke="#5ad0b2"/>
  <text x="1216" y="129" fill="#8debd1" font-family="Arial, sans-serif" font-size="16">部分完成</text>
  <rect x="82" y="186" width="1276" height="112" rx="12" fill="#101718" stroke="#28413e"/>
  <g font-family="Arial, sans-serif"><text x="112" y="228" fill="#899b97" font-size="15">示例统计</text><text x="112" y="270" fill="#f1f7f5" font-size="28" font-weight="700">128 cases</text><text x="430" y="270" fill="#5ad0b2" font-size="28" font-weight="700">120 passed</text><text x="782" y="270" fill="#ff8d83" font-size="28" font-weight="700">8 failed</text><text x="1080" y="270" fill="#d0aa66" font-size="28" font-weight="700">1 rerun</text></g>
  <text x="82" y="350" fill="#8debd1" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">REGISTERED ARTIFACTS</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="82" y="380" width="1276" height="76" rx="10" fill="#101718" stroke="#304d49"/><rect x="106" y="402" width="76" height="32" rx="6" fill="#223132"/><text x="125" y="424" fill="#a9bbb7" font-size="13">HTML</text><text x="214" y="423" fill="#f1f7f5">pytest-report.html</text><text x="832" y="423" fill="#8debd1">registered → archived</text><text x="1184" y="423" fill="#a9bbb7">Open ↗</text>
    <rect x="82" y="470" width="1276" height="76" rx="10" fill="#101718" stroke="#304d49"/><rect x="106" y="492" width="76" height="32" rx="6" fill="#223132"/><text x="125" y="514" fill="#a9bbb7" font-size="13">MEDIA</text><text x="214" y="513" fill="#f1f7f5">video-playlist.m3u8</text><text x="832" y="513" fill="#8debd1">archived</text><rect x="1158" y="491" width="112" height="34" rx="17" fill="#193a32" stroke="#5ad0b2"/><text x="1182" y="514" fill="#8debd1" font-size="14">Viewed</text>
    <rect x="82" y="560" width="1276" height="76" rx="10" fill="#101718" stroke="#304d49"/><rect x="106" y="582" width="76" height="32" rx="6" fill="#223132"/><text x="125" y="604" fill="#a9bbb7" font-size="13">LOG</text><text x="214" y="603" fill="#f1f7f5">case-output.log</text><text x="832" y="603" fill="#8debd1">archived</text><text x="1184" y="603" fill="#a9bbb7">Open ↗</text>
  </g>
  <text x="82" y="712" fill="#899b97" font-family="Arial, sans-serif" font-size="16">业务名称、Task ID、URL、case、路径和真实统计均为脱敏示例。</text>
</svg>
